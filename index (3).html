<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLOR SPLASH – رتّب الألوان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@500;700&display=swap">
<style>
:root{--bg:#fff1f7;--bg2:#d9e8ff;--ink:#2b1d55;--mut:#6a5a9a;--card:#ffffffb8;--line:#2b1d5522;--btn:#ff5d9e;--btn2:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1140;--bg2:#0d2a5c;--ink:#fff;--mut:#bdb2ee;--card:#ffffff17;--line:#ffffff2b}}
:root[data-theme="dark"]{--bg:#1a1140;--bg2:#0d2a5c;--ink:#fff;--mut:#bdb2ee;--card:#ffffff17;--line:#ffffff2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(900px 600px at 15% 0,var(--bg2),transparent 70%),var(--bg);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #ffd93d;outline-offset:2px}
.scr{display:none;position:relative;z-index:1;max-width:960px;margin:0 auto;padding:16px}
.scr.on{display:block}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;background:#ffffff40;border:1px solid #fff6;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;backdrop-filter:blur(6px)}
.chip:disabled{opacity:.4}
.disp{font-family:"Baloo Bhaijaan 2",Tajawal,sans-serif;font-weight:800}
h1{margin:18px 0 0;text-align:center;font-size:clamp(3rem,13vw,6.4rem);line-height:1;direction:ltr;letter-spacing:.01em}
h1 b{display:inline-block;animation:hop 2.4s ease-in-out infinite;text-shadow:0 5px 0 #0002}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
.sub{text-align:center;font-size:clamp(1.4rem,5vw,2.2rem);margin:2px 0 6px}
.tag{text-align:center;color:var(--mut);font-size:1.1rem;margin:0 auto 12px;max-width:34ch}
.hero{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin:28px 0 24px;--tw:clamp(40px,11vw,66px)}
.hero .tube{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.cta{text-align:center}
.btn{display:inline-block;background:linear-gradient(180deg,#ff8cc0,var(--btn));color:#fff;font-size:2rem;padding:8px 54px 10px;border-radius:99px;box-shadow:0 8px 0 #b3306c,0 14px 24px #0003;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #b3306c}
.btn.alt{background:var(--card);color:var(--ink);font-size:1.2rem;padding:8px 24px;box-shadow:none;border:1px solid var(--line)}
h2{font-size:1.9rem;margin:40px 0 12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.lv{aspect-ratio:1;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.lv small{color:#ffb400;font-size:.75rem;min-height:.9rem;font-family:Tajawal}
.lv:disabled{opacity:.4;cursor:not-allowed}
.lv.next{background:linear-gradient(180deg,#9a85ff,var(--btn2));color:#fff;border-color:transparent}
.foot{text-align:center;color:var(--mut);margin:36px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tubes{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,4vw,30px) clamp(10px,3vw,24px);margin:28px auto 0;max-width:640px;padding:44px 18px 28px;background:#ffffff1f;border:1px solid #ffffff40;border-radius:40px;backdrop-filter:blur(4px);--tw:clamp(40px,12vw,60px)}
.tube{position:relative;width:var(--tw);height:calc(var(--tw)*.78*4 + 14px);display:flex;flex-direction:column-reverse;padding:5px;border:3px solid #ffffffa0;border-top-color:#ffffff60;border-radius:8px 8px calc(var(--tw)/2) calc(var(--tw)/2);background:#ffffff26;overflow:hidden;transition:transform .2s;box-shadow:inset 0 -8px 16px #0001,0 6px 14px #0002}
.tube::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#00000038,#fff0 28%,#ffffff3d 52%,#fff0 72%,#0000003a);pointer-events:none;z-index:1}
.tube::after{content:"";position:absolute;top:8px;bottom:14px;inset-inline-start:7px;width:5px;border-radius:9px;background:#ffffff70;pointer-events:none}
.tube.sel{transform:translateY(calc(var(--tw)*-.6))}
.seg{position:relative;height:calc(var(--tw)*.78);background:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(var(--tw)*.26);color:#ffffff80;text-shadow:0 1px 2px #0004}
.seg:last-child::before{content:"";position:absolute;left:-12%;right:-12%;top:-4px;height:9px;border-radius:50%;background:var(--c);filter:brightness(1.22);animation:wave 1.5s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-7%) scaleY(.7)}to{transform:translateX(7%) scaleY(1.15)}}
.stream{position:absolute;width:7px;border-radius:4px;z-index:4;transform-origin:top;animation:sflow .15s ease-out;box-shadow:inset -2px 0 #fff5}
@keyframes sflow{from{transform:scaleY(0)}}
.seg.drop,.seg.grow{animation:grow .45s ease-out}
@keyframes grow{from{height:0}}
.tube.full{box-shadow:0 0 0 3px #ffd93d,0 0 22px #ffd93d99}
.tube.hint{animation:hp 1s ease-in-out infinite alternate}
@keyframes hp{from{box-shadow:0 0 0 3px #fff,0 0 8px #fff}to{box-shadow:0 0 0 3px #ffd93d,0 0 28px #ffd93d}}
.hud{text-align:center;color:var(--mut);margin-top:26px;font-weight:700}
body[data-w]{--ink:#fff;--mut:#ffffffd6;--card:#ffffff2e;--line:#ffffff4d;color:#fff}
body[data-w] .ovc{background:#2a1a5e}
body[data-w="0"]{background:linear-gradient(180deg,#5cd0ff,#2f6fed 55%,#1b2f86)}
body[data-w="1"]{background:linear-gradient(160deg,#ff9ad5,#c77dff 55%,#7c5cff)}
body[data-w="2"]{background:linear-gradient(180deg,#ffd166,#ff7a59 45%,#c9367e)}
body[data-w="3"]{background:linear-gradient(180deg,#b6e86b,#2eb872 55%,#0b6e5a)}
body[data-w="4"]{background:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff9,transparent),radial-gradient(2px 2px at 150px 20px,#ffe9a8,transparent),linear-gradient(#1b0f4d,#0b1030);background-size:170px 120px,170px 120px,170px 120px,auto}
body[data-w="5"]{background:linear-gradient(200deg,#5eead4,#6366f1 50%,#312e81)}
body[data-w]{background-attachment:fixed}
.cheer{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:clamp(2.8rem,13vw,5.4rem);color:#fff;text-shadow:0 5px 0 #0004,0 0 28px #ffd93d;opacity:0;pointer-events:none;z-index:4}
.cheer.on{animation:cheer 1.1s ease-out}
@keyframes cheer{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.15) rotate(3deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;padding:20px;z-index:5;overflow:hidden}
.ov.on{display:flex}
.ovc{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:32px;padding:28px 34px;text-align:center;max-width:360px;width:100%}
.ovc h3{font-size:2.6rem;margin:0}
.stars{font-size:2.6rem;color:#ffb400;letter-spacing:6px;margin:4px 0 16px;direction:ltr}
.ovc .btn{font-size:1.6rem;margin:4px}
.cf{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){h1 b,.hero .tube,.bubbles i,.seg.drop,.cf{animation:none}.tube{transition:none}.cheer.on{animation:fade 1s}.seg:last-child::before,.seg.grow{animation:none}}
</style>
</head>
<body>
<div class="bubbles" id="bub" aria-hidden="true"></div>
<div class="cheer disp" id="cheer" aria-live="polite"></div>

<section id="home" class="scr on">
  <div class="top"><span class="chip" id="prog"></span><span class="chip coins"></span><span><button class="chip" id="snd" aria-label="sound">🔊</button> <button class="chip" id="lang"></button></span></div>
  <h1 class="disp" id="title" aria-label="COLOR SPLASH"></h1>
  <p class="sub disp" data-t="sub"></p>
  <p class="tag" data-t="tag"></p>
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div class="cta"><button class="btn disp" id="play"></button><br><button class="btn alt" id="gift" style="margin-top:14px"></button></div>
  <h2 class="disp" data-t="levels"></h2>
  <div class="grid" id="grid"></div>
  <p class="foot">TECHNO GAMES</p>
</section>

<section id="game" class="scr">
  <div class="bar">
    <button class="chip" id="back" data-t="home"></button>
    <span class="chip disp" id="lvl"></span><span class="chip coins"></span>
    <span><button class="chip" id="hint">💡 5</button> <button class="chip" id="undo" data-t="undo"></button> <button class="chip" id="addt" data-t="addt"></button> <button class="chip" id="redo" data-t="restart"></button></span>
  </div>
  <div class="tubes" id="tubes"></div>
  <p class="hud" id="hud"></p>
</section>

<div class="ov" id="ov"><div class="ovc">
  <h3 class="disp" id="ovt"></h3><div class="stars" id="ovs"></div><p class="disp" id="ovg" style="margin:-8px 0 12px;font-size:1.6rem"></p>
  <button class="btn disp" id="ovmain"></button><br><button class="btn alt" id="ovhome" data-t="home"></button>
</div></div>

<script>
/* ===== Config: edit here to tune the game ===== */
const CFG={cap:4,maxColors:10,empties:2,levels:100,
  colors:["#ff4d6d","#ff9f1c","#ffd60a","#8ac926","#12c2a9","#38bdf8","#4361ee","#9b5de5","#f15bb5","#a0522d"],
  glyphs:["●","▲","■","★","♥","◆","✚","☾","✿","☀"]};
const TX={ar:{sub:"رتّب الألوان",tag:"اسكب السوائل حتى يحتوي كل أنبوب على لون واحد فقط.",play:"ابدأ اللعب",cont:"تابع اللعب",levels:"المراحل",home:"الرئيسية",undo:"تراجع",addt:"+ أنبوب",restart:"إعادة",lvl:"المرحلة",moves:"الحركات",win:"رائع!",next:"التالية",done:"مكتملة",tut1:"👆 اضغط على الأنبوب المضيء",tut2:"👇 الآن اضغط على المضيء لتسكب فيه",gift:"🎁 هدية اليوم +20",nocoins:"عملات غير كافية",nohint:"لا يوجد تلميح",cheers:["ممتاز!","رائع!","مذهل!","عبقري!","أحسنت!"],perfect:"مثالي!",lang:"English"},
en:{sub:"Sort the Colors",tag:"Pour the liquids until every tube holds just one color.",play:"Play",cont:"Continue",levels:"Levels",home:"Home",undo:"Undo",addt:"+ Tube",restart:"Restart",lvl:"Level",moves:"Moves",win:"Awesome!",next:"Next level",done:"done",tut1:"👆 Tap the glowing tube",tut2:"👇 Now tap the glowing tube to pour",gift:"🎁 Daily gift +20",nocoins:"Not enough coins",nohint:"No hint available",cheers:["Excellent!","Amazing!","Awesome!","Brilliant!","Great job!"],perfect:"Perfect!",lang:"عربي"}};
const $=s=>document.querySelector(s),CAP=CFG.cap;
let S={done:0,stars:{},lang:"ar",snd:true,coins:0,gift:""},tubes=[],hist=[],sel=-1,cur=1,addUsed=false,won=false,lastPour=null;
try{Object.assign(S,JSON.parse(localStorage.getItem("cs1")))}catch(e){}
const save=()=>{try{localStorage.setItem("cs1",JSON.stringify(S))}catch(e){}};
const t=k=>TX[S.lang][k];

/* ===== Sound (tiny synth) ===== */
let ac;function beep(f,d=.12,v=.07){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

/* ===== Level generation (seeded, shuffled, 2 empty tubes) ===== */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function rawLevel(lv,at=0){
  const r=rng(lv*104729+7+at*977),n=Math.min(2+((lv-1)/2|0),CFG.maxColors),pool=[];
  for(let c=0;c<n;c++)for(let k=0;k<CAP;k++)pool.push(c);
  let T,tries=0;
  do{for(let i=pool.length-1;i>0;i--){const j=r()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
    T=[];for(let i=0;i<n;i++)T.push(pool.slice(i*CAP,i*CAP+CAP))}
  while(T.some(x=>x.every(v=>v===x[0]))&&++tries<300);
  for(let i=0;i<CFG.empties;i++)T.push([]);
  return T}

/* ===== Solver: guarantees solvable levels + powers hints ===== */
function solve(T,cap=25000){
  const seen=new Set();let nodes=0;
  function dfs(T,path){
    if(T.every(a=>!a.length||isFull(a)))return path;
    if(++nodes>cap)return null;
    const k=T.map(x=>x.join("")).sort().join("|");if(seen.has(k))return null;seen.add(k);
    const mv=[];
    for(let f=0;f<T.length;f++){const a=T[f];if(!a.length)continue;const uni=a.every(v=>v===a[0]);
      for(let t=0;t<T.length;t++){const b=T[t];if(f===t||b.length>=CAP)continue;
        if(b.length&&b[b.length-1]!==a[a.length-1])continue;
        if(!b.length&&uni)continue;mv.push([f,t,b.length?0:1])}}
    mv.sort((x,y)=>x[2]-y[2]);
    for(const [f,t] of mv){const N=T.map(a=>a.slice()),a=N[f],b=N[t],c=a[a.length-1];
      while(a.length&&a[a.length-1]===c&&b.length<CAP)b.push(a.pop());
      const r=dfs(N,path.concat([[f,t]]));if(r)return r}
    return null}
  return dfs(T,[])}
function genLevel(lv){let T;for(let at=0;at<6;at++){T=rawLevel(lv,at);if(solve(T))break}return T}
const HC=5,vib=n=>{try{if(S.snd&&navigator.vibrate)navigator.vibrate(n)}catch(e){}};
const coins=()=>document.querySelectorAll(".coins").forEach(e=>e.textContent="🪙 "+S.coins);
$("#hint").onclick=()=>{if(busy||won)return;if(S.coins<HC){say(t("nocoins"));return}
  const p=solve(tubes,30000);if(!p||!p.length){say(t("nohint"));return}
  S.coins-=HC;save();coins();sel=p[0][0];render();$("#tubes").children[p[0][1]].classList.add("hint")};

/* ===== Rendering ===== */
const hd=(i,k,a)=>i>=0&&cur>=8&&cur%4===0&&k<a.length-1;
const tubeHTML=(a,i,tag="button",extra="")=>`<${tag} class="tube${extra}" ${i>=0?`data-i="${i}" aria-label="${a.length}/${CAP}"`:""}>${a.map((c,k)=>`<div class="seg${lastPour&&lastPour.to===i&&k>=a.length-lastPour.m?" drop":""}" style="--c:${hd(i,k,a)?"#8d8aa8":CFG.colors[c]}">${hd(i,k,a)?"?":CFG.glyphs[c]}</div>`).join("")}</${tag}>`;
const isFull=a=>a.length===CAP&&a.every(v=>v===a[0]);
function render(){
  $("#tubes").innerHTML=tubes.map((a,i)=>tubeHTML(a,i,"button",(i===sel?" sel":"")+(isFull(a)?" full":""))).join("");
  $("#tubes").querySelectorAll(".tube").forEach(b=>b.onclick=()=>clickTube(+b.dataset.i));
  $("#hud").textContent=`${t("moves")}: ${hist.length}`;
  $("#undo").disabled=!hist.length;$("#addt").disabled=addUsed;lastPour=null;
  if(cur===1&&!S.done&&!won){const p=solve(tubes,8000);if(p&&p.length){const s0=sel===p[0][0];$("#tubes").children[s0?p[0][1]:p[0][0]].classList.add("hint");$("#hud").textContent=t(s0?"tut2":"tut1")}}}

const cheer=()=>{const a=TX[S.lang].cheers;return a[Math.random()*a.length|0]};
function say(x){const c=$("#cheer");c.textContent=x;c.classList.remove("on");void c.offsetWidth;c.classList.add("on")}
let busy=false;
function go(f,to){
  const a=tubes[f],b=tubes[to],c=a[a.length-1];let k=0;while(k<a.length&&a[a.length-1-k]===c)k++;
  const m=Math.min(k,CAP-b.length),E=$("#tubes").children,el=E[f],tel=E[to];
  const done=()=>{vib(25);pour(f,to);lastPour=null;sel=-1;busy=false;render();if(isFull(tubes[to])){say(cheer());beep(880,.2);vib([40,30,60])}if(tubes.every(x=>!x.length||isFull(x)))setTimeout(win,500)};
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||!el||!tel){done();return}
  busy=true;
  const w=el.offsetWidth,h=el.offsetHeight,sg=tel.offsetLeft>el.offsetLeft?1:-1,tx=tel.offsetLeft+w/2,ty=tel.offsetTop,
    dx=tx-(el.offsetLeft+w/2)-sg*.45*h,dy=ty-(el.offsetTop+h/2)+.05*h,ly=ty-.12*h,top=ty+h-8-(b.length+m)*.78*w,d=300+m*120;
  el.style.zIndex=4;el.style.transition="transform .3s ease";el.style.transform=`translate(${dx}px,${dy}px) rotate(${sg*70}deg)`;
  setTimeout(()=>{
    const st=document.createElement("div");st.className="stream";st.style.cssText=`left:${tx-3}px;top:${ly}px;height:${Math.max(top-ly,10)}px;background:${CFG.colors[c]}`;$("#game").appendChild(st);
    [...el.querySelectorAll(".seg")].slice(-m).forEach(s=>{s.style.cssText+=`overflow:hidden;transition:height ${d}ms ease-in;height:0`});
    for(let j=0;j<m;j++){const s=document.createElement("div");s.className="seg grow";s.style.cssText=`--c:${CFG.colors[c]};animation-duration:${d}ms`;s.textContent=CFG.glyphs[c];tel.appendChild(s)}
    beep(300,d/1000,.04);
    setTimeout(()=>{st.remove();el.style.transform="none"},d);
    setTimeout(done,d+240)},300)}
/* ===== Game logic ===== */
function canPour(f,to){
  const a=tubes[f],b=tubes[to];if(f===to||!a.length||b.length>=CAP)return false;
  return !b.length||b[b.length-1]===a[a.length-1]}
function pour(f,to){
  const a=tubes[f],b=tubes[to],c=a[a.length-1];let k=0;
  while(k<a.length&&a[a.length-1-k]===c)k++;
  const m=Math.min(k,CAP-b.length);
  hist.push(JSON.stringify(tubes));
  for(let i=0;i<m;i++)b.push(a.pop());
  lastPour={to,m};beep(380+m*90,.18)}
function clickTube(i){
  if(won||busy)return;
  if(sel<0){if(tubes[i].length){sel=i;beep(520,.08)}}
  else if(sel===i)sel=-1;
  else if(canPour(sel,i)){go(sel,i);return}
  else{sel=tubes[i].length?i:-1;beep(200,.1)}
  render()}
function play(lv){
  cur=lv;tubes=genLevel(lv);hist=[];sel=-1;addUsed=false;won=false;
  $("#lvl").textContent=`${t("lvl")} ${lv}`;$("#ov").classList.remove("on");document.body.dataset.w=((lv-1)/5|0)%6;coins();show("game");render()}
$("#undo").onclick=()=>{if(hist.length&&!won&&!busy){tubes=JSON.parse(hist.pop());sel=-1;render();beep(300,.08)}};
$("#addt").onclick=()=>{if(!addUsed&&!won&&!busy){addUsed=true;tubes.push([]);render();beep(440,.1)}};
$("#redo").onclick=()=>{if(!busy)play(cur)};
function win(){
  won=true;const par=tubes.length*3,m=hist.length,st=m<=par?3:m<=par*1.6?2:1;
  S.stars[cur]=Math.max(S.stars[cur]||0,st);S.done=Math.max(S.done,cur);const gain=st*3;S.coins+=gain;save();coins();$("#ovg").textContent="+"+gain+" 🪙";vib([60,40,60,40,120]);
  $("#ovt").textContent=st===3?t("perfect"):cheer();$("#ovs").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("#ovmain").textContent=t("next");$("#ovmain").onclick=()=>cur<CFG.levels?play(cur+1):goHome();
  $("#ov").classList.add("on");$("#ovmain").focus();[261,330,392,523].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*120));
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let i=0;i<46;i++){const d=document.createElement("div");d.className="cf";d.style.cssText=`left:${Math.random()*100}%;background:${CFG.colors[i%10]};animation-duration:${1.8+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s`;$("#ov").appendChild(d);setTimeout(()=>d.remove(),4000)}}

/* ===== Home ===== */
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));scrollTo(0,0)}
function goHome(){$("#ov").classList.remove("on");document.body.removeAttribute("data-w");home();show("home")}
function home(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("#lang").textContent=t("lang");$("#snd").textContent=S.snd?"🔊":"🔇";coins();$("#gift").style.display=S.gift===new Date().toDateString()?"none":"";
  $("#play").textContent=S.done?t("cont"):t("play");$("#prog").textContent=`${S.done} / ${CFG.levels} ${t("done")}`;
  $("#title").innerHTML="COLOR SPLASH".split("").map((ch,i)=>ch===" "?" ":`<b style="color:${CFG.colors[i%10]};animation-delay:${i*.12}s">${ch}</b>`).join("");
  $("#hero").innerHTML=[[0,5,2,1],[3,0,4],[6,6,2,7,8],[1,4,9,3],[7,5,0]].map((a,i)=>tubeHTML(a,-1,"div","").replace('class="tube"',`class="tube" style="animation-delay:${i*.25}s"`)).join("");
  let s="";for(let i=1;i<=CFG.levels;i++)s+=`<button class="lv disp${i===S.done+1?" next":""}" data-l="${i}" ${i>S.done+1?"disabled":""}>${i}<small>${"★".repeat(S.stars[i]||0)}</small></button>`;
  $("#grid").innerHTML=s;$("#grid").querySelectorAll(".lv").forEach(b=>b.onclick=()=>play(+b.dataset.l))}
$("#play").onclick=()=>play(Math.min(S.done+1,CFG.levels));
$("#gift").onclick=()=>{S.coins+=20;S.gift=new Date().toDateString();save();home();say("+20 🪙");vib(40)};
$("#back").onclick=()=>{if(!busy)goHome()};$("#ovhome").onclick=goHome;
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";save();home();if($("#game").classList.contains("on")){document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$("#lvl").textContent=`${t("lvl")} ${cur}`;render()}};
$("#snd").onclick=()=>{S.snd=!S.snd;save();$("#snd").textContent=S.snd?"🔊":"🔇"};
for(let i=0;i<14;i++){const b=document.createElement("i"),z=14+Math.random()*40;b.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${12+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;$("#bub").appendChild(b)}
home();
</script>
</body>
